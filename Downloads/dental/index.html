 Virudhunagar District`,line3:`Tamil Nadu 626117`},mapsQuery:`Athi Ram Dental Clinic, Rajapalayam, Tamil Nadu`,social:{instagram:`#`,facebook:`#`,google:`https://www.google.com/maps/search/?api=1&query=Athi+Ram+Dental+Clinic+Rajapalayam`}},Fx=`https://maps.google.com/maps?q=${encodeURIComponent(Q.mapsQuery)}&z=16&output=embed`,Ix=`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(Q.mapsQuery)}`,Lx=(e=`Hello Athi Ram Dental Clinic, I would like to book an appointment.`)=>`https://wa.me/${Q.whatsapp}?text=${encodeURIComponent(e)}`,Rx={name:`Dr. Athi Ram`,qualification:`BDS — Dental Surgeon`,role:`Chief Dental Surgeon`,photo:null,experience:`10+`,bio:`A gentle, detail-oriented dentist who believes every patient deserves to understand their treatment. From a child’s first check-up to a complex root canal, care is planned calmly, explained clearly and delivered with a light hand.`,highlights:[`Explains every step before treatment begins`,`Pain-conscious, minimally invasive approach`,`Strict sterilisation for every patient`,`Patient, reassuring care for children & seniors`]},zx=[{value:10,suffix:`+`,label:`Years of dental care`},{value:12,suffix:`+`,label:`Treatments under one roof`},{value:100,suffix:`%`,label:`Sterilised instruments`},{value:6,suffix:``,label:`Days open every week`}],Bx=[{id:`rct`,icon:`rootCanal`,title:`Root Canal Treatment`,short:`Save a painful, infected tooth instead of losing it.`,detail:`The infected pulp is gently cleaned, disinfected and sealed under local anaesthesia, then protected with a crown. Modern techniques make the procedure about as comfortable as a regular filling.`,points:[`Relieves tooth-ache at the source`,`Usually 1–3 visits`,`Crown to restore strength`],tone:`navy`},{id:`extraction`,icon:`extraction`,title:`Tooth Removal`,short:`Gentle extractions, including wisdom teeth.`,detail:`When a tooth cannot be saved, it is removed carefully under local anaesthesia with clear after-care instructions to support fast, comfortable healing.`,points:[`Numbing for a pain-free procedure`,`Wisdom tooth care`,`Clear after-care guidance`],tone:`gold`},{id:`scaling`,icon:`scaling`,title:`Scaling & Cleaning`,short:`Remove tartar and stains for healthier gums.`,detail:`Ultrasonic scaling removes hardened tartar and surface stains, followed by polishing. Regular cleaning prevents gum bleeding, bad breath and gum disease.`,points:[`Fresher breath`,`Healthier, firmer gums`,`Recommended every 6 months`],tone:`blue`},{id:`kids`,icon:`kids`,title:`Children’s Dental Care`,short:`Friendly, fear-free visits for little smiles.`,detail:`Check-ups, fluoride application, sealants and child-friendly fillings in a calm setting — building good habits and a positive feeling about the dentist from an early age.`,points:[`First-visit friendly`,`Cavity prevention`,`Habit & brushing guidance`],tone:`gold`},{id:`general`,icon:`general`,title:`General Dental Care`,short:`Check-ups, diagnosis and everyday dental needs.`,detail:`Complete oral examination, treatment planning and advice for the whole family. Early diagnosis keeps treatment simpler, shorter and more affordable.`,points:[`Full oral examination`,`Personalised treatment plan`,`Family-friendly care`],tone:`navy`},{id:`fillings`,icon:`filling`,title:`Tooth-Coloured Fillings`,short:`Natural-looking repairs for cavities and chips.`,detail:`Decay is removed and the tooth restored with composite material matched to your natural tooth shade — strong, discreet and completed in a single visit in most cases.`,points:[`Matches natural shade`,`Usually single visit`,`Preserves tooth structure`],tone:`blue`},{id:`crowns`,icon:`crown`,title:`Crowns & Bridges`,short:`Restore broken teeth and replace missing ones.`,detail:`Custom-made caps protect weak or root-canal-treated teeth, and bridges fill gaps left by missing teeth — restoring your bite, comfort and smile.`,points:[`Ceramic & metal options`,`Restores chewing`,`Natural appearance`],tone:`navy`},{id:`dentures`,icon:`denture`,title:`Dentures`,short:`Comfortable complete & partial dentures.`,detail:`Carefully measured removable dentures that restore your smile and ability to eat comfortably, with adjustments until the fit feels right.`,points:[`Complete & partial options`,`Comfort-fit adjustments`,`Care guidance`],tone:`gold`},{id:`whitening`,icon:`whitening`,title:`Teeth Whitening`,short:`A brighter smile, safely supervised.`,detail:`Professional whitening lightens stains from tea, coffee and age under dental supervision, protecting your gums and enamel throughout.`,points:[`Dentist-supervised`,`Protects gums & enamel`,`Visible, natural results`],tone:`blue`}],Vx=[`General Check-up / Consultation`,...Bx.map(e=>e.title),`Tooth Pain / Emergency`,`Not sure — need advice`],Hx=[{day:1,label:`Monday`,slots:[[`09:30`,`13:30`],[`17:00`,`21:00`]]},{day:2,label:`Tuesday`,slots:[[`09:30`,`13:30`],[`17:00`,`21:00`]]},{day:3,label:`Wednesday`,slots:[[`09:30`,`13:30`],[`17:00`,`21:00`]]},{day:4,label:`Thursday`,slots:[[`09:30`,`13:30`],[`17:00`,`21:00`]]},{day:5,label:`Friday`,slots:[[`09:30`,`13:30`],[`17:00`,`21:00`]]},{day:6,label:`Saturday`,slots:[[`09:30`,`13:30`],[`17:00`,`21:00`]]},{day:0,label:`Sunday`,slots:[],note:`By appointment only`}],Ux=[`09:30 AM`,`10:30 AM`,`11:30 AM`,`12:30 PM`,`05:00 PM`,`06:00 PM`,`07:00 PM`,`08:00 PM`],Wx=[{name:`Patient name`,meta:`Root Canal Treatment`,rating:5,theme:`Comfortable treatment`,text:`I was very nervous about my root canal, but the doctor explained each step and it was far more comfortable than I expected.`},{name:`Patient name`,meta:`Children’s Dental Care`,rating:5,theme:`Friendly care`,text:`Very patient with my son. He was scared at first but left smiling and actually wants to come back for his check-up.`},{name:`Patient name`,meta:`Scaling & Cleaning`,rating:5,theme:`Cleanliness`,text:`Clean, well-maintained clinic and instruments are sterilised in front of you. Gums feel much healthier after cleaning.`},{name:`Patient name`,meta:`General Check-up`,rating:5,theme:`Clear explanations`,text:`The doctor showed me exactly what was wrong and gave options instead of pushing expensive treatment.`},{name:`Patient name`,meta:`Tooth Removal`,rating:5,theme:`Affordable`,text:`Reasonable charges and no hidden costs. The extraction was quick and the after-care advice was very clear.`},{name:`Patient name`,meta:`Dentures`,rating:5,theme:`Comfortable treatment`,text:`Took time to adjust my mother’s dentures until they fit perfectly. Very respectful with elderly patients.`}],Gx=[`Friendly care`,`Clear explanations`,`Cleanliness`,`Affordable`,`Comfortable treatment`],Kx=[{cat:`Treatments`,q:`Is root canal treatment painful?`,a:`Root canal treatment is done under local anaesthesia, so most patients feel only mild pressure — similar to a filling. It actually relieves the severe pain caused by the infection. Some tenderness for a day or two afterwards is normal and managed with simple medication.`},{cat:`Appointments`,q:`How do I book an appointment?`,a:`Use the appointment form on this page, message us on WhatsApp, or simply call the clinic. Our team will confirm your preferred date and time. Walk-ins are welcome, but booking ahead reduces waiting time.`},{cat:`Pain & comfort`,q:`I am anxious about dental treatment. What can I expect?`,a:`You are not alone. We explain every step before we begin, use numbing for any procedure that could be uncomfortable, and you can raise your hand to pause at any time. Your comfort sets the pace.`},{cat:`Children`,q:`At what age should my child first visit the dentist?`,a:`Ideally by their first birthday or when the first tooth appears. Early, friendly visits help prevent cavities and make children comfortable with dental care for life.`},{cat:`Treatments`,q:`How often should I get my teeth cleaned?`,a:`Most people benefit from professional scaling and cleaning every six months. If you have gum problems, the doctor may recommend more frequent visits.`},{cat:`Follow-ups`,q:`Do I n
